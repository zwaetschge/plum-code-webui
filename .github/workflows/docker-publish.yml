name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_NAME: valentin2177/plum-code-webui

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SESSION_SECRET: ci-session-secret-ci-session-secret-0001
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-000000001
      ENCRYPTION_KEY: ci-encryption-key-ci-encryption-key-0001
      POSTGRES_PASSWORD: ci-postgres-password
      IMAGEMAGICK_BIN: convert
      PGHOST: 127.0.0.1
      PGUSER: plumcode
      PGDATABASE: plumcode
      PGPASSWORD: ci-postgres-password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: plumcode
          POSTGRES_DB: plumcode
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plumcode -d plumcode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install image test dependency
        run: sudo apt-get update && sudo apt-get install --yes imagemagick

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run regression suites
        run: pnpm test

      - name: Dry-run database migrations
        run: pnpm --filter @plum-code-webui/backend test:migrations

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Build production bundles
        run: pnpm build

      - name: Start compiled production backend
        run: node scripts/compiled-start-regression-tests.mjs

      - name: Validate portable Compose configuration
        env:
          SESSION_SECRET: ci-session-secret-ci-session-secret-0001
          JWT_SECRET: ci-jwt-secret-ci-jwt-secret-000000001
        run: docker compose -f docker-compose.yml config -q

  build:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build local candidate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: plum-code-webui:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: plum-code-webui:ci-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # arm64 dropped: the codex (Rust) and opencode-ai (Go) CLIs ship
          # native binaries whose npm postinstall verification crashes with
          # SIGILL under QEMU emulation on the amd64 GitHub runner. Anyone
          # on arm64 hardware can build natively from source via the
          # included scripts/install.sh — no emulation, no SIGILL.
          platforms: linux/amd64
