<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bento Modern — design preview · 400×300</title>
<style>
  /* ============================================================
     BENTO MODERN DESIGN SYSTEM — 400×300 THUMBNAIL PREVIEW
     Asymmetric tile grid · soft violet accents · airy whitespace
     ============================================================ */
  :root {
    --bm-primary: #6D3A78;
    --bm-primary-soft: #A76BB1;
    --bm-tint: #F3EDF6;
    --bm-ink: #18181B;
    --bm-ink-2: #52525B;
    --bm-ink-3: #A1A1AA;
    --bm-surface: #FFFFFF;
    --bm-line: #ECEDEF;
    --bm-radius: 18px;
    --bm-shadow: 0 10px 26px -12px rgba(24, 24, 27, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 400px; height: 300px; overflow: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 12px;
    color: var(--bm-ink);
    background: #F7F7F8;
    padding: 16px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1.6fr 1fr 1fr;
    grid-template-rows: 96px 82px 74px;
    gap: 10px;
    height: 100%;
  }

  .tile {
    background: var(--bm-surface);
    border-radius: var(--bm-radius);
    box-shadow: var(--bm-shadow);
    padding: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .tile-hero {
    grid-row: span 2;
    background: linear-gradient(150deg, #6D3A78 0%, #A76BB1 100%);
    color: #fff;
    justify-content: space-between;
  }

  .eyebrow {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--bm-ink-3);
  }

  .tile-hero .eyebrow { color: rgba(255, 255, 255, 0.75); }

  .headline {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: -0.02em;
  }

  .spark { display: flex; align-items: flex-end; gap: 4px; margin-top: 10px; }

  .spark span {
    width: 9px;
    background: rgba(255, 255, 255, 0.35);
    border-radius: 3px;
  }
  .spark span:nth-child(odd) { background: rgba(255, 255, 255, 0.7); }

  .metric { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .metric small { font-size: 10px; font-weight: 500; color: var(--bm-ink-2); }

  .chips { display: flex; gap: 6px; margin-top: 8px; }

  .chip {
    font-size: 9px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--bm-tint);
    color: var(--bm-primary);
  }

  .chart { display: flex; align-items: flex-end; gap: 6px; flex: 1; margin-top: 8px; }

  .chart i {
    flex: 1;
    border-radius: 4px 4px 2px 2px;
    background: var(--bm-tint);
  }
  .chart i:nth-child(2) { background: var(--bm-primary-soft); }
  .chart i:nth-child(3) { background: var(--bm-primary); }

  .rows { margin-top: 6px; }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--bm-line);
    font-size: 10px;
    color: var(--bm-ink-2);
  }
  .row:last-child { border-bottom: none; }

  .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 99px;
    margin-right: 6px;
    vertical-align: 1px;
  }
</style>
</head>
<body>
  <div class="grid">
    <div class="tile tile-hero">
      <div>
        <div class="eyebrow">Overview</div>
        <div class="headline">Everything<br>in its tile.</div>
      </div>
      <div class="spark">
        <span style="height:12px"></span><span style="height:22px"></span>
        <span style="height:16px"></span><span style="height:30px"></span>
        <span style="height:24px"></span><span style="height:38px"></span>
        <span style="height:31px"></span>
      </div>
    </div>

    <div class="tile" style="grid-row: span 2">
      <div class="eyebrow">Weekly</div>
      <div class="metric">94.2<small>%</small></div>
      <div class="chart">
        <i style="height:34%"></i><i style="height:58%"></i><i style="height:44%"></i>
        <i style="height:72%"></i>
      </div>
    </div>

    <div class="tile">
      <div class="chips">
        <span class="chip">Launch</span><span class="chip">Q4</span>
      </div>
    </div>

    <div class="tile">
      <div class="rows">
        <div class="row"><span><i class="dot" style="background:#6D3A78"></i>Teams</span><b>12</b></div>
        <div class="row"><span><i class="dot" style="background:#A76BB1"></i>Boards</span><b>7</b></div>
      </div>
    </div>

    <div class="tile" style="grid-column: span 2; flex-direction: row; align-items: center; gap: 10px;">
      <div style="flex:1">
        <div class="eyebrow">Now streaming</div>
        <div style="font-size:13px;font-weight:600;margin-top:3px">Modular product stories</div>
      </div>
      <div style="width:52px;height:52px;border-radius:14px;background:conic-gradient(#6D3A78 0 62%, #EDE6F0 62% 100%);position:relative">
        <div style="position:absolute;inset:8px;border-radius:99px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#6D3A78">62</div>
      </div>
    </div>
  </div>
</body>
</html>
